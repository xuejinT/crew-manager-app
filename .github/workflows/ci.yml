# The repo's only automated gate. CodeRabbit is configured to skip review here,
# so before this workflow existed a PR could merge with no signal at all — which
# is how the manifest store-art test spent a day red on main after PR #41
# changed app.json without updating it.
#
# Node is pinned to 22, the floor package.json declares. It is NOT just a
# convenience: Node 25 ships an empty Web Storage global that shadows jsdom's
# real localStorage, and the behavior specs fail wholesale under it for reasons
# that have nothing to do with the diff.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Node 22 bundles npm 10, whose arborist crashes resolving vitest 4's
      # optional peer graph (@vitest/browser-playwright -> @vitejs/devtools-vitest):
      # `Cannot read properties of null (reading 'edgesOut')` in #loadPeerSet,
      # before a single package is written. Reproduced locally with npm@10.9.4 and
      # clean on 11.6.2, so the npm version is pinned independently of Node's.
      - name: Pin npm past the arborist peer-resolution crash
        run: npm install -g npm@11.6.2

      # No package-lock.json is committed, so `npm ci` cannot run and there is
      # nothing for setup-node to cache against. A plain install writes a
      # lockfile into the runner's workspace only, discarded with the job.
      - name: Install
        run: npm install --no-audit --no-fund

      # typecheck -> build -> frontend tests -> backend selftest.
      - name: Check
        run: npm run check

      # The build writes ui/index.mjs, which is COMMITTED (the host loads it
      # directly from the repo). A PR that edits src/ without rebuilding ships a
      # bundle that does not match its own source, and nothing else would notice.
      - name: Committed bundle matches the build
        run: |
          if ! git diff --exit-code -- ui/index.mjs; then
            echo "::error file=ui/index.mjs::ui/index.mjs is stale — run 'node scripts/build.mjs' and commit the result"
            exit 1
          fi

  # A separate job, not a step in `check`: it needs no npm install, so it reports
  # in seconds instead of behind the suite, and a red here names a distinct
  # problem ("you shipped without relabelling") rather than "the build is broken".
  #
  # pull_request only. On a push to main the merge has already happened, so a red
  # would report a fact nobody can act on — and the version that matters is the
  # one on the commit the catalog resolves, which this gate protects on the way in.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the base commit, which a depth-1 clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm install`: the script is stdlib-only node, deliberately, so this
      # gate cannot be taken down by a dependency-resolution failure — which is
      # exactly what broke this workflow's first two runs.
      - name: Manifest version bumps when the shipped app changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The checked-out ref is the merge commit, so BASE_SHA...HEAD is this
          # PR's net change against the base.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-version-bump.mjs
