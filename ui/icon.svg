<!-- BRIEF: Compact geometric Overwatch app icon; quiet dark field, split-view frame, central scan lens, and three restrained work-state signals. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Overwatch</title>
  <desc id="desc">A split work view observed through a quiet scan lens.</desc>
  <defs>
    <linearGradient id="background-gradient" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202736"/>
      <stop offset="1" stop-color="#111620"/>
    </linearGradient>
    <linearGradient id="lens-gradient" x1="23" y1="21" x2="43" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AC5FF"/>
      <stop offset="1" stop-color="#6D7EFF"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#background-gradient)"/>
    <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>
  <g id="split-view" fill="none" stroke="#AEB9CC" stroke-linecap="round" stroke-width="2.4">
    <path d="M15 18.5h10M15 25h7M15 31.5h8" opacity="0.72"/>
    <path d="M43 18.5h6M43 25h6M43 31.5h5" opacity="0.54"/>
    <path d="M32 15v34" opacity="0.22"/>
  </g>
  <g id="scan-lens">
    <circle cx="32" cy="33" r="11.5" fill="#151C29" stroke="url(#lens-gradient)" stroke-width="3"/>
    <path d="M39.9 41.1 47 48.2" fill="none" stroke="#8AC5FF" stroke-linecap="round" stroke-width="3.4"/>
    <circle cx="32" cy="33" r="4.2" fill="#8AC5FF" fill-opacity="0.16" stroke="#A8D6FF" stroke-width="2"/>
  </g>
  <g id="state-signals">
    <circle cx="17" cy="46.5" r="2.2" fill="#F2C66D"/>
    <circle cx="24" cy="46.5" r="2.2" fill="#78AEFF"/>
    <circle cx="31" cy="46.5" r="2.2" fill="#71D6A0"/>
  </g>
</svg>
